[project]
name = "chatmem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harpreet", email = "harpreet.02007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "pydantic>=2.14.2",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatmem = "chatmem.main:app"
chat-memory-rag = "chat_memory_rag:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
